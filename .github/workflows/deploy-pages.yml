name: Deploy to GitHub Pages

# Builds the BattleChess web client and publishes it to GitHub Pages, so it
# can be played from any browser (incl. mobile). Vs Computer and Local
# 2-player work fully on the static site; online multiplayer needs the Node
# server hosted separately.

on:
  push:
    branches:
      - main
      - claude/3d-chess-multiplayer-fxqava
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer pushes cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build client for Pages
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build:client

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
